<!DOCTYPE html>
<html>
<head>
    <title>Smart MRT Navigation</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: #111827;
            width: 95%;
            max-width: 420px;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.15);
        }

        .header {
            font-family: 'Orbitron', sans-serif;
            font-size: 18px;
            color: #22d3ee;
            margin-bottom: 8px;
        }

        .destination {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .eta {
            display: inline-block;
            background: #22d3ee;
            color: black;
            padding: 6px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .progress {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 10px;
        }

        img {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 15px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }

        .next {
            background: #22d3ee;
            color: black;
        }

        .next:hover {
            background: #06b6d4;
        }

        .arrival-screen {
            text-align: center;
            padding: 30px 0;
            font-size: 18px;
            color: #22d3ee;
            font-family: 'Orbitron', sans-serif;
        }

    </style>
</head>
<body>

<div class="card">
    <div class="header">INTERACTIVE MRT NAVIGATION</div>
    <div class="destination" id="destinationTitle"></div>
    <div class="eta" id="etaText"></div>
    <div class="progress" id="progressText"></div>
    <div id="content"></div>
    <button class="btn next" id="nextBtn">Next</button>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const destinationId = params.get("id");

    const destinations = {
        1: { name: "Exit A", steps: 8, time: "4 mins" },
        2: { name: "Exit B", steps: 6, time: "3 mins" },
        3: { name: "Exit C", steps: 7, time: "4 min" },
        4: { name: "Exit D", steps: 11, time: "5 mins" },
        5: { name: "Exit E", steps: 15, time: "6 mins" },
        6: { name: "Lift to Exit A", steps: 5, time: "3 mins" },
        7: { name: "Lift to Exit B, D, E", steps: 2, time: "2 mins" },
        8: { name: "Lift to Exit C", steps: 12, time: "6 mins" },
        9: { name: "Toilet", steps: 2, time: "1 min" }
    };

    let currentStep = 1;

    if (destinations[destinationId]) {

        const destination = destinations[destinationId];
        const content = document.getElementById("content");
        const nextBtn = document.getElementById("nextBtn");

        document.getElementById("destinationTitle").innerText = destination.name;
        document.getElementById("etaText").innerText = "Estimated Time: " + destination.time;

        function loadStep() {

            if (currentStep > destination.steps) {
                content.innerHTML = `
                    <div class="arrival-screen">
                        ARRIVED AT ${destination.name.toUpperCase()}
                    </div>
                `;
                document.getElementById("progressText").innerText = "";
                nextBtn.disabled = true;
                nextBtn.innerText = "Have a Nice Day!";
                return;
            }

            content.innerHTML =
                `<img src="images/dest${destinationId}/step${currentStep}.jpg">`;

            document.getElementById("progressText").innerText =
                "Step " + currentStep + " of " + destination.steps;
        }

        loadStep();

        nextBtn.addEventListener("click", () => {
            currentStep++;
            loadStep();
        });

    } else {
        window.location.href = "manual-entry.html";
    }

</script>

</body>
</html>
